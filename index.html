<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narik Juragan Angkot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root {
  /* Satu dunia visual: aspal terminal, pelat kuning angkutan umum, cat hijau Si Ijo.
     Tata letak: satu kolom selebar HP; HUD pelat nomor di atas, tombol utama menempel di bawah. */
  color-scheme: light;
  --aspal: #1b2630;
  --aspal-2: #2a3945;
  --kertas: #f1eee4;
  --kartu: #fffdf8;
  --garis: #d8d2c0;
  --tinta: #1b2630;
  --tinta-2: #5a6670;
  --ijo: #1a8f4c;
  --ijo-tua: #0f6b37;
  --plat: #ffc61a;
  --rem: #d43a2b;
  --biru: #2a6fdb;
  --t05: #1a8f4c; --t09: #e07a1f; --t12: #b83a86;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--aspal); color: var(--tinta); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--biru); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; max-width: 480px; margin: 0 auto; background: var(--kertas); display: flex; flex-direction: column; position: relative; overflow: hidden; }
#v { height: 100%; min-height: 0; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- HUD: pelat nomor ---------- */
.hud { background: var(--aspal); color: #fff; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.hud-row { display: flex; gap: 8px; align-items: stretch; }
.plat { background: var(--plat); color: #111; border: 2px solid #111; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--plat), inset 0 0 0 3px rgba(0,0,0,.55); padding: 4px 10px 3px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.plat small { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; opacity: .7; line-height: 1.1; }
.plat b { font-family: var(--display); font-size: 19px; line-height: 1.1; white-space: nowrap; }
.plat.grow { flex: 1; }
.plat.merah { background: #fff; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px var(--rem); color: var(--rem); border-color: var(--rem); }
.hud-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: #c9d2d9; align-items: center; }
.hud-meta b { color: #fff; font-weight: 700; }
.bar { height: 7px; border-radius: 4px; background: rgba(125,135,145,.3); overflow: hidden; min-width: 54px; flex: 1; }
.bar i { display: block; height: 100%; background: var(--ijo); border-radius: 4px; }
.bar.warn i { background: #e0a21a; } .bar.bad i { background: var(--rem); }
.meter { display: inline-flex; align-items: center; gap: 6px; }
.meter .bar { width: 64px; flex: none; }
.marka { height: 10px; margin: 0 -16px; background: repeating-linear-gradient(90deg, #fff 0 22px, transparent 22px 40px) center / auto 3px no-repeat; opacity: .8; }

/* ---------- bagian ---------- */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sec-h h2 { font-family: var(--display); font-size: 15px; letter-spacing: .02em; }
.sec-h span { font-size: 12.5px; color: var(--tinta-2); }
.kartu { background: var(--kartu); border: 1.5px solid var(--tinta); border-radius: 10px; box-shadow: 3px 3px 0 var(--tinta); }

.papan { padding: 10px 14px; }
.papan ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.papan li { padding-left: 16px; position: relative; }
.papan li::before { content: ""; position: absolute; left: 0; top: .55em; width: 7px; height: 7px; background: var(--plat); border: 1.5px solid var(--tinta); border-radius: 50%; }

/* target: sobekan karcis */
.karcis { display: grid; grid-template-columns: 74px 1fr; background: var(--kartu); border: 1.5px solid var(--tinta); border-radius: 8px; overflow: hidden; }
.karcis + .karcis { margin-top: 8px; }
.karcis .stub { background: var(--plat); border-right: 2px dashed var(--tinta); padding: 8px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; text-align: center; }
.karcis .isi { padding: 8px 12px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.karcis .isi p { font-weight: 600; }
.karcis .isi small { color: var(--tinta-2); font-size: 12px; }
.karcis .isi .bar { flex: none; }
.karcis.done .stub { background: var(--ijo); color: #fff; }

/* angkot */
.angkot { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.angkot + .angkot { margin-top: 12px; }
.a-top { display: grid; grid-template-columns: 118px 1fr; gap: 12px; align-items: center; }
.a-top img { width: 100%; height: auto; display: block; }
.a-top h3 { font-family: var(--display); font-size: 17px; line-height: 1.15; }
.stiker { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--tinta-2); }
.a-kondisi { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-top: 6px; }
.a-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); min-width: 0; }
.fld select, .fld input { font-size: 14.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--tinta); background: #fff; border: 1.5px solid var(--tinta); border-radius: 7px; padding: 8px 8px; width: 100%; min-width: 0; }
.setoran { display: flex; align-items: center; gap: 8px; }
.setoran .val { flex: 1; text-align: center; font-family: var(--display); font-size: 17px; }
.step { width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid var(--tinta); background: #fff; font-weight: 800; font-size: 20px; line-height: 1; }
.proy { font-size: 13px; background: var(--kertas); border-radius: 7px; padding: 7px 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ijo-tua); } .pill.warn { color: #9a6a00; } .pill.bad { color: var(--rem); }
.a-foot { display: flex; gap: 8px; }

.btn { border: 1.5px solid var(--tinta); background: #fff; border-radius: 8px; padding: 9px 12px; font-weight: 700; font-size: 14px; text-align: center; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.ijo { background: var(--ijo); color: #fff; }
.btn.plat-b { background: var(--plat); }
.btn.blok { width: 100%; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.menu .btn { box-shadow: 2px 2px 0 var(--tinta); }

.cta { padding: 10px 16px 14px; background: var(--kertas); border-top: 1.5px solid var(--garis); }
.gas { width: 100%; font-family: var(--display); font-size: 18px; letter-spacing: .02em; color: #fff; background: var(--ijo); border: 2px solid var(--tinta); border-radius: 10px; padding: 13px 12px; box-shadow: 0 4px 0 var(--tinta); transition: transform .08s, box-shadow .08s; }
.gas:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.gas.kuning { background: var(--plat); color: #111; }

/* ---------- siang ---------- */
.peta { background: #e7efe2; border: 1.5px solid var(--tinta); border-radius: 10px; overflow: hidden; }
.peta svg { display: block; width: 100%; height: auto; }
.rit { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.rit-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rit-h h2 { font-family: var(--display); font-size: 18px; }
.rit-h span { font-size: 12.5px; color: var(--tinta-2); }
.dots { display: flex; gap: 5px; }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--garis); }
.dots i.on { background: var(--ijo); } .dots i.now { background: var(--plat); outline: 1.5px solid var(--tinta); }
.ramai { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
.ramai span { padding: 2px 8px; border-radius: 6px; background: var(--kertas); border-left: 4px solid var(--c, #999); }
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode button { text-align: left; border: 1.5px solid var(--tinta); border-radius: 9px; background: #fff; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px; box-shadow: 2px 2px 0 var(--tinta); }
.mode button b { font-size: 14.5px; }
.mode button small { font-size: 11.5px; color: var(--tinta-2); line-height: 1.3; }
.mode button:disabled { opacity: .45; box-shadow: none; }
.hasil { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hasil li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px dashed var(--garis); }
.hasil li:first-child { border-top: 0; }
.hasil .n { font-weight: 700; } .hasil .v { font-family: var(--display); font-size: 15px; color: var(--ijo-tua); text-align: right; }
.hasil small { grid-column: 1 / -1; color: var(--tinta-2); font-size: 12.5px; }
.kejadian h3 { font-family: var(--display); font-size: 16px; }
.kejadian .eyebrow, .eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--rem); }
.pilihan { display: flex; flex-direction: column; gap: 8px; }
.pilihan button { text-align: left; border: 1.5px solid var(--tinta); border-radius: 9px; background: #fff; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; box-shadow: 2px 2px 0 var(--tinta); }
.pilihan button b { font-size: 14.5px; } .pilihan button small { color: var(--tinta-2); font-size: 12px; }
.pilihan button:disabled { opacity: .45; box-shadow: none; }

/* ---------- malam: buku setoran ---------- */
.buku { padding: 12px 14px 6px; background: var(--kartu) repeating-linear-gradient(transparent 0 31px, #cfe0ee 31px 32px); background-position: 0 44px; }
.buku h2 { font-family: var(--display); font-size: 16px; margin-bottom: 8px; }
.baris { display: flex; justify-content: space-between; gap: 10px; height: 32px; align-items: center; }
.baris b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.baris .plus { color: var(--ijo-tua); } .baris .minus { color: var(--rem); }
.baris.total { border-top: 2px solid var(--tinta); font-weight: 800; }
.sopir-row { padding: 9px 0; border-top: 1px dashed var(--garis); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.sopir-row:first-of-type { border-top: 0; }
.sopir-row small { grid-column: 1 / -1; color: var(--tinta-2); font-size: 12.5px; }

/* ---------- lapisan: cerita, kartu bab, modal ---------- */
.lapis { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.lapis.gelap { background: rgba(15, 22, 28, .82); }
.adegan { padding: 16px; display: flex; flex-direction: column; gap: 0; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.bicara { background: var(--kartu); border: 2px solid var(--tinta); border-radius: 12px; padding: 22px 16px 14px; position: relative; box-shadow: 0 5px 0 #000; min-height: 132px; display: flex; flex-direction: column; gap: 10px; }
.bicara p { font-size: 16.5px; line-height: 1.5; }
.bicara.narator { background: var(--aspal-2); color: #eef2f4; border-color: #000; }
.bicara.narator p { font-style: italic; font-weight: 500; }
.tag { position: absolute; top: -15px; left: 12px; background: var(--c, #333); color: #fff; font-family: var(--display); font-size: 13px; padding: 4px 10px 3px; border: 2px solid var(--tinta); border-radius: 6px; transform: rotate(-2deg); }
.ketuk { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin-top: auto; align-self: flex-end; }
.wajah { width: 76px; height: 76px; border-radius: 50%; background: var(--c, #555); border: 3px solid #fff; color: #fff; font-family: var(--display); font-size: 30px; display: grid; place-items: center; margin: 0 0 22px 8px; box-shadow: 0 4px 0 rgba(0,0,0,.5); }
.lembar { background: var(--kertas); border-radius: 16px 16px 0 0; border-top: 2px solid var(--tinta); max-height: 88%; display: flex; flex-direction: column; }
.lembar-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 8px; gap: 10px; }
.lembar-h h2 { font-family: var(--display); font-size: 17px; }
.lembar-b { overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--tinta); background: #fff; font-weight: 800; flex: none; }
.item { background: var(--kartu); border: 1.5px solid var(--tinta); border-radius: 9px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.item h3 { font-size: 15px; font-weight: 800; } .item p { font-size: 13px; color: var(--tinta-2); grid-column: 1; }
.item .btn { grid-row: 1 / span 2; grid-column: 2; }
.item .full { grid-column: 1 / -1; }
.warna { display: flex; gap: 8px; flex-wrap: wrap; }
.warna button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--tinta); background: var(--c); }
.warna button[aria-pressed="true"] { outline: 3px solid var(--plat); outline-offset: 2px; }
.kartu-bab { margin: auto 16px; background: var(--plat); border: 3px solid #111; border-radius: 12px; box-shadow: inset 0 0 0 3px var(--plat), inset 0 0 0 5px #111, 0 8px 0 #000; padding: 26px 20px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.kartu-bab h2 { font-family: var(--display); font-size: 28px; line-height: 1.05; }
.kartu-bab p { font-weight: 600; }
.kartu-bab .btn { margin-top: 8px; background: #111; color: #fff; border-color: #111; font-size: 15px; padding: 12px; }
.roti { position: absolute; left: 16px; right: 16px; top: 12px; z-index: 30; background: var(--aspal); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 0 rgba(0,0,0,.4); }

/* ---------- layar judul ---------- */
.judul { flex: 1; overflow-y: auto; background: var(--aspal); color: #fff; padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.papan-trayek { align-self: flex-start; background: #fff; color: var(--ijo-tua); font-weight: 800; font-size: 12px; letter-spacing: .12em; padding: 5px 10px; border: 2px solid #111; border-radius: 4px; }
.logo { font-family: var(--display); font-size: clamp(64px, 24vw, 104px); line-height: .86; color: var(--plat); letter-spacing: -.01em; text-shadow: 4px 5px 0 #000; }
.judul .sub { font-size: 17px; font-weight: 600; color: #dfe6ea; max-width: 30ch; }
.judul img { width: 100%; max-width: 380px; align-self: center; margin: 4px 0 -6px; filter: drop-shadow(0 14px 10px rgba(0,0,0,.45)); }
.judul .fld { color: #aeb9c1; }
.judul .fld input { border-color: #000; font-size: 16px; padding: 11px 12px; }
.judul .kecil { font-size: 12.5px; color: #93a0aa; }
.judul .btn-teks { background: none; border: 0; color: #c9d2d9; text-decoration: underline; font-size: 13.5px; padding: 8px; align-self: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
